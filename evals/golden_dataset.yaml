  # ---------- tool: needs get_order_status ----------
  - id: T01
    category: tool
    question: Where is my order ORD-1002?
    expected_answer: Order ORD-1002 has shipped, with an estimated delivery date of 2026-11-06.
    expected_sources: []
    should_refuse: false
    expected_tool: {name: get_order_status, arguments: {order_id: ORD-1002}}
  - id: T02
    category: tool
    question: What's the status of ORD-1001?
    expected_answer: Order ORD-1001 was delivered (2026-10-20).
    expected_sources: []
