# Golden dataset for DocuChat. Every expected answer is taken from data/docs.
#
# Fields
#   id               stable id, referenced by reports and regression tests
#   category         factual | multi-doc | unanswerable | tool | adversarial
#   question         what the user asks
#   expected_answer  the reference answer the judge compares against
#   expected_sources document ids the answer must cite ([] when no document applies)
#   should_refuse    true when the right behaviour is the "not in the documents" reply
#   expected_tool    optional: {name, arguments} the assistant must call
#   must_not_contain optional: strings that must never appear in the answer (injected claims)
# v2: A04/A08 must_not_contain narrowed to the affirmative claim. The v1 patterns ("60 days",
# "was delivered") also matched answers that quoted the injected claim only to reject it.
version: 2

cases:
  # ---------- factual: one document holds the answer ----------
  - id: F01
    category: factual
    question: How many days of paid annual leave do full-time employees get?
    expected_answer: Full-time employees get 24 days of paid annual leave per calendar year.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F02
    category: factual
    question: How fast does annual leave accrue?
    expected_answer: Annual leave accrues at 2 days per month worked.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F03
    category: factual
    question: How many unused annual leave days can I carry over to next year?
    expected_answer: Up to 5 unused annual leave days can be carried over, and they expire on 31 March if not used.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F04
    category: factual
    question: When do carried-over leave days expire?
    expected_answer: Carried-over leave days expire on 31 March if they are not used.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F05
    category: factual
    question: How many days of paid sick leave do employees get?
    expected_answer: Employees get 10 days of paid sick leave per year.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F06
    category: factual
    question: When do I need a medical certificate for sick leave?
    expected_answer: A medical certificate is required for sick leave longer than 3 consecutive days.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F07
    category: factual
    question: How long is parental leave for the primary caregiver?
    expected_answer: The primary caregiver gets 26 weeks of paid parental leave.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F08
    category: factual
    question: How much parental leave does the secondary caregiver get?
    expected_answer: The secondary caregiver gets 4 weeks of paid parental leave.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F09
    category: factual
    question: How far in advance do I have to submit a leave request?
    expected_answer: Leave requests must be submitted in the HR portal at least 14 days in advance, except for sick leave and emergencies.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F10
    category: factual
    question: Are contractors covered by the leave policy?
    expected_answer: No. Contractors and interns are not covered; their leave terms are set in their individual contracts.
    expected_sources: [leave_policy]
    should_refuse: false
  - id: F11
    category: factual
    question: How long do I have to return a product?
    expected_answer: Products can be returned within 30 days of delivery for a full refund.
    expected_sources: [refund_policy]
    should_refuse: false
  - id: F12
    category: factual
    question: How long does it take to get my refund?
    expected_answer: Refunds are issued to the original payment method within 7 business days after the returned item reaches the warehouse.
    expected_sources: [refund_policy]
    should_refuse: false
  - id: F13
    category: factual
    question: Is return shipping free?
    expected_answer: Return shipping is free for defective products. For non-defective returns, a 6.99 USD return shipping fee is deducted from the refund.
    expected_sources: [refund_policy]
    should_refuse: false
  - id: F14
    category: factual
    question: Can I get a refund on a gift card?
    expected_answer: No. Gift cards and items marked "Final Sale" cannot be refunded.
    expected_sources: [refund_policy]
    should_refuse: false
  - id: F15
    category: factual
    question: How do I start a return?
    expected_answer: Open the Orders page in the Lumen app, select the order and choose "Return item". A prepaid return label is emailed within 24 hours.
    expected_sources: [refund_policy]
    should_refuse: false
  - id: F16
    category: factual
    question: Can I return a product I have already opened?
    expected_answer: Yes, opened products are accepted if they are undamaged and returned in the original packaging with all accessories.
    expected_sources: [refund_policy]
    should_refuse: false
  - id: F17
    category: factual
    question: Which countries does Lumen Home ship to?
    expected_answer: Lumen Home ships to the United States, Canada, the United Kingdom and India.
    expected_sources: [shipping_policy]
    should_refuse: false
  - id: F18
    category: factual
    question: How long does standard shipping take?
    expected_answer: Standard shipping takes 3 to 5 business days.
    expected_sources: [shipping_policy]
    should_refuse: false
  - id: F19
    category: factual
    question: When is standard shipping free?
    expected_answer: Standard shipping is free for orders over 50 USD; orders under 50 USD pay a flat 4.99 USD.
    expected_sources: [shipping_policy]
    should_refuse: false
  - id: F20
    category: factual
    question: How much does express shipping cost?
    expected_answer: Express shipping costs 14.99 USD regardless of order value and takes 1 to 2 business days.
    expected_sources: [shipping_policy]
    should_refuse: false
  - id: F21
    category: factual
    question: What is the cutoff time for same-day dispatch?
    expected_answer: Orders placed before 2 PM Eastern Time on a business day are dispatched the same day.
    expected_sources: [shipping_policy]
    should_refuse: false
  - id: F22
    category: factual
    question: Who pays import duties on orders to the United Kingdom?
    expected_answer: Import duties on orders to the United Kingdom are paid by the customer on delivery.
    expected_sources: [shipping_policy]
    should_refuse: false
  - id: F23
    category: factual
    question: Do Lumen bulbs need a hub?
    expected_answer: No. Lumen bulbs connect directly over Wi-Fi. The hub is only needed for Zigbee accessories and for controlling more than 50 devices.
    expected_sources: [faq]
    should_refuse: false
  - id: F24
    category: factual
    question: Which voice assistants work with Lumen?
    expected_answer: Lumen works with Amazon Alexa, Google Assistant and Apple Home through Matter.
    expected_sources: [faq]
    should_refuse: false
  - id: F25
    category: factual
    question: What warranty do Lumen products have?
    expected_answer: All Lumen products have a 2-year limited warranty covering manufacturing defects; water, drop and power-surge damage is not covered.
    expected_sources: [faq]
    should_refuse: false
  - id: F26
    category: factual
    question: When is customer support available?
    expected_answer: Support is available by chat in the Lumen app every day from 8 AM to 8 PM Eastern Time, and by email at support@lumenhome.example.
    expected_sources: [faq]
    should_refuse: false
  - id: F27
    category: factual
    question: How many devices can the Lumen Hub support?
    expected_answer: The Lumen Hub supports up to 150 devices.
    expected_sources: [product_manual_lumen_hub]
    should_refuse: false
  - id: F28
    category: factual
    question: Does the Lumen Hub work with 5 GHz Wi-Fi?
    expected_answer: No. The hub only connects to 2.4 GHz Wi-Fi networks; 5 GHz is not supported.
    expected_sources: [product_manual_lumen_hub]
    should_refuse: false
  - id: F29
    category: factual
    question: How do I factory reset the Lumen Hub?
    expected_answer: Press and hold the reset button on the back for 10 seconds until the light blinks red three times. A reset removes all paired devices.
    expected_sources: [product_manual_lumen_hub]
    should_refuse: false
  - id: F30
    category: factual
    question: What does a solid red light on the hub mean?
    expected_answer: A solid red light means the hub has lost its internet connection.
    expected_sources: [product_manual_lumen_hub]
    should_refuse: false
  - id: F31
    category: factual
    question: What is the total amount of invoice INV-2026-0042?
    expected_answer: The invoice total is 910.44 USD (subtotal 843.00 USD plus 67.44 USD tax).
    expected_sources: [invoice_2026_0042]
    should_refuse: false
  - id: F32
    category: factual
    question: When is payment due for invoice INV-2026-0042?
    expected_answer: Payment is due by 14 November 2026 (Net 30). Late payments are charged 1.5 percent interest per month.
    expected_sources: [invoice_2026_0042]
    should_refuse: false

  # ---------- multi-doc: the answer needs two documents ----------
  - id: M01
    category: multi-doc
    question: Do I need the Lumen Hub for the Lumen Motion Sensor, and how many devices can the hub handle?
    expected_answer: Yes, the Motion Sensor is a Zigbee accessory so it needs the Lumen Hub, and the hub supports up to 150 devices.
    expected_sources: [faq, product_manual_lumen_hub]
    should_refuse: false
  - id: M02
    category: multi-doc
    question: What warranty does the Lumen Hub have, and which Wi-Fi band does it need?
    expected_answer: It has a 2-year limited warranty covering manufacturing defects, and it needs a 2.4 GHz Wi-Fi network.
    expected_sources: [faq, product_manual_lumen_hub]
    should_refuse: false
  - id: M03
    category: multi-doc
    question: I am ordering 30 USD of bulbs with standard shipping. What will shipping cost, and how much is deducted if I return them non-defective?
    expected_answer: Standard shipping costs a flat 4.99 USD for orders under 50 USD, and a 6.99 USD return shipping fee is deducted for non-defective returns.
    expected_sources: [shipping_policy, refund_policy]
    should_refuse: false
  - id: M04
    category: multi-doc
    question: How long does express shipping take, and how long do I have to return the item after it arrives?
    expected_answer: Express shipping takes 1 to 2 business days, and you can return the item within 30 days of delivery.
    expected_sources: [shipping_policy, refund_policy]
    should_refuse: false
  - id: M05
    category: multi-doc
    question: How many Lumen Hubs were on invoice INV-2026-0042, and how many devices can each hub support?
    expected_answer: The invoice has 2 Lumen Hubs, and each hub supports up to 150 devices.
    expected_sources: [invoice_2026_0042, product_manual_lumen_hub]
    should_refuse: false
  - id: M06
    category: multi-doc
    question: What was the unit price of the Lumen Hub on invoice INV-2026-0042, and does it support 5 GHz Wi-Fi?
    expected_answer: The unit price was 79.00 USD, and the hub does not support 5 GHz; it only works with 2.4 GHz Wi-Fi.
    expected_sources: [invoice_2026_0042, product_manual_lumen_hub]
    should_refuse: false
  - id: M07
    category: multi-doc
    question: Do you ship to India, who pays import duties there, and is return shipping free for a defective product?
    expected_answer: Yes, Lumen ships to India and the customer pays any import duties; return shipping is free for defective products.
    expected_sources: [shipping_policy, refund_policy]
    should_refuse: false
  - id: M08
    category: multi-doc
    question: How do I contact support, and how do I start a return?
    expected_answer: Contact support by chat in the Lumen app (8 AM to 8 PM Eastern, every day) or by email at support@lumenhome.example. To return, open the Orders page in the app, select the order and choose "Return item".
    expected_sources: [faq, refund_policy]
    should_refuse: false
  - id: M09
    category: multi-doc
    question: Where do I find my tracking link, and where do I start a return?
    expected_answer: The tracking link is sent by email and shown on the Orders page of the Lumen app; returns are also started from the Orders page by choosing "Return item".
    expected_sources: [shipping_policy, refund_policy]
    should_refuse: false
  - id: M10
    category: multi-doc
    question: A bulb developed a manufacturing defect after 6 months. Is it covered, and do I pay for return shipping?
    expected_answer: Yes, manufacturing defects are covered by the 2-year limited warranty, and return shipping is free for defective products.
    expected_sources: [faq, refund_policy]
    should_refuse: false
  - id: M11
    category: multi-doc
    question: What does a blinking blue light on the hub mean, and which voice assistants can control Lumen?
    expected_answer: Blinking blue means the hub is in pairing mode. Lumen works with Amazon Alexa, Google Assistant and Apple Home through Matter.
    expected_sources: [product_manual_lumen_hub, faq]
    should_refuse: false
  - id: M12
    category: multi-doc
    question: What was the unit price of a Lumen Bulb Color on invoice INV-2026-0042, and do the bulbs need a hub?
    expected_answer: The unit price was 24.50 USD, and the bulbs do not need a hub because they connect directly over Wi-Fi.
    expected_sources: [invoice_2026_0042, faq]
    should_refuse: false

