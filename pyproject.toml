[project]
name = "docuchat-qa"
version = "0.1.0"
description = "Tiny RAG document assistant with a full QA platform around it"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "appium-python-client>=6.1.4",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "locust>=2.47.0",
    "pytest>=8.3",
    "pytest-playwright>=0.10.0",
    "pytest-rerunfailures>=16.7",
    "ruff>=0.7",
    "schemathesis>=4.33.0",
]
evals = [
    "deepeval>=4.3.2",
    "langchain<1",
    "langchain-community<0.4",
    "langchain-core<1",
    "langchain-openai<1",
    "ragas>=0.4.3",
]

[tool.uv]
# This is an application, not a library, so uv doesn't need to build/install it.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Screenshots and traces are kept only for failing browser tests (in test-results/).
addopts = "-ra --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results"
filterwarnings = [
    # Raised by pytest-playwright's own session `base_url` fixture when tests are classes; harmless.
    "ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning",
]
markers = [
    "smoke: fast checks that the core path works",
    "conversation: multi-turn conversation scripts (recorded LLM)",
    "tools: tool-calling behaviour (recorded LLM)",
    "regression: tests added from production failures",
    "safety: red-team and injection guards",
    "api: HTTP API contract and negative tests",
    "web: Playwright browser tests of the chat UI",
    "data: SQL validation of the chat log database",
    "mobile: Appium mobile-web tests (needs an Android emulator; skipped unless --run-mobile)",
    "perf: performance checks",
    "llm: talks to the LLM (retried only when the LLM is live)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Embedded Postman (JavaScript) test snippets read better on one line each.
"scripts/export_postman.py" = ["E501"]
