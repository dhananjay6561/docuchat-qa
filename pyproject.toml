[project]
name = "docuchat-qa"
version = "0.1.0"
description = "Tiny RAG document assistant with a full QA platform around it"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
# This is an application, not a library, so uv doesn't need to build/install it.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "smoke: fast checks that the core path works",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
